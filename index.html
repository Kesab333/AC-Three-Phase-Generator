<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Virtual Lab: AC Three Phase Generator (star connection) with a three-channel oscilloscope" />
  <title>AC Three Phase Generator | SOLVE Virtual Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/nitk.webp" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>


  <script defer src="js/physics.js"></script>
  <script defer src="js/cro.js"></script>
  <script defer src="js/wiring.js"></script>
  <script defer src="js/apparatus.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/navigation.js"></script>
  <script defer src="js/app.js"></script>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/scope.css" />
  <link rel="stylesheet" href="css/generator.css" />
  <link rel="stylesheet" href="css/navigation.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body class="dashboard-active">
  <header class="app-header">
    <div class="app-header__inner">
      <div class="logo-div"><img id="labLogo" class="logo" src="images/nitk.webp" alt="NITK logo" /></div>
      <h1 id="labTitle">AC Three Phase Generator</h1>
    </div>
  </header>

  <div class="app-container">
    <nav class="sidebar" aria-label="Experiment sections">
      <ul id="navMenu" class="tool-menu"></ul>
    </nav>

    <main class="main">
      <div id="dashboardView" class="dashboard-view"></div>

      <section id="workspaceCard" class="workspace-card" data-section="simulation" data-interactive="true"
        data-side="on">
        <div class="task-heading">
          <h2 id="workspaceTitle" class="task-title">Simulation</h2>
          <div class="heading-actions">
            <button id="helpButton" class="heading-button help-button" type="button" aria-label="Open help">?</button>
            <button id="fullscreenButton" class="heading-button" type="button" aria-label="Toggle page fullscreen"
              title="Fullscreen">&#x26F6;</button>
            <button id="dashboardCloseBtn" class="close-button" type="button" aria-label="Back to dashboard"
              title="Back to dashboard"><span class="close-icon">&#x2715;</span> Close</button>
          </div>
        </div>

        <div class="simulation-toolbar">
          <div class="status-chip"><span id="statusDot" class="status-dot running"></span><span
              id="experimentStatus">Generator running</span></div>
        </div>

        <div class="lab-stage">
          <div id="workspaceViewport" class="workspace-viewport">

            <section id="panel-simulation" class="panel panel--fill" data-panel="simulation" hidden>
              <div id="simulationWindow" class="sim-window">
                <button id="viewportFullscreenButton" class="viewport-fullscreen-btn" type="button"
                  aria-label="Toggle viewport full mode" title="Full viewport mode">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path
                      d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                  </svg>
                </button>
                <div id="simViewport" class="sim-viewport">
                  <svg id="simulation-canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690"
                    preserveAspectRatio="xMidYMid meet"
                    aria-label="Three phase generator, three lamps and a digital oscilloscope wired in star connection">
                    <defs>
                      <!-- Single Stator Pole with Concave Arc Face -->
                      <g id="stator-pole">
                        <path
                          d="M 273.3,186.7 A 78 78 0 0 1 326.7,186.7 L 326.7,172 L 314,172 L 314,120 L 286,120 L 286,172 L 273.3,172 Z" />
                      </g>

                      <!-- Permanent Magnet Rotor -->
                      <g id="rotor">
                        <path d="M -1,0 A 1 1 0 0 1 1,0 Z" fill="url(#rotorBlueGrad)" stroke="none" />
                        <path d="M -1,0 A 1 1 0 0 0 1,0 Z" fill="url(#rotorRedGrad)" stroke="none" />
                        <ellipse cx="0" cy="-0.47" rx="0.44" ry="0.14" fill="#ffffff" opacity="0.15" />
                        <ellipse cx="0" cy="0.47" rx="0.44" ry="0.14" fill="#000000" opacity="0.1" />
                        <circle cx="0" cy="0" r="1" fill="none" stroke="#ffffff" stroke-width="0.025" opacity="0.4" />
                      </g>

                      <!-- Rotor Gradients -->
                      <linearGradient id="rotorBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="100%" stop-color="#1e4bb8" />
                      </linearGradient>
                      <linearGradient id="rotorRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ef4444" />
                        <stop offset="100%" stop-color="#b91c1c" />
                      </linearGradient>
                      <radialGradient id="shaftGlow" cx="35%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#6b7280" />
                        <stop offset="60%" stop-color="#1f2937" />
                        <stop offset="100%" stop-color="#030712" />
                      </radialGradient>

                      <!-- 3D Coil Depth Filter -->
                      <filter id="coil-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0.8" dy="1.2" stdDeviation="1" flood-color="#000000" flood-opacity="0.38" />
                      </filter>

                      <!-- Back Turns for Pole 1 (Layer 1, behind top tooth) -->
                      <g id="pole-coil-back-p1">
                        <path d="M 181, 157 C 176, 159 176, 162 200, 160.5 C 224, 159 224, 162 219, 164
                   M 181, 171 C 176, 173 176, 176 200, 174.5 C 224, 173 224, 176 219, 178
                   M 181, 185 C 176, 187 176, 190 200, 188.5 C 224, 187 224, 190 219, 192" />
                      </g>

                      <!-- Back Turns for Pole 4 (Layer 1, behind bottom tooth) -->
                      <g id="pole-coil-back-p4">
                        <path d="M 219, 328 C 224, 330 224, 333 200, 331.5 C 176, 330 176, 333 181, 335
                   M 219, 342 C 224, 344 224, 347 200, 345.5 C 176, 344 176, 347 181, 349
                   M 219, 356 C 224, 358 224, 361 200, 359.5 C 176, 358 176, 361 181, 363" />
                      </g>

                      <radialGradient id="lampHalo" cx="50%" cy="50%" r="50%">
                        <stop offset="0" stop-color="#fff6b8" stop-opacity=".95" />
                        <stop offset=".4" stop-color="#ffd44d" stop-opacity=".5" />
                        <stop offset="1" stop-color="#ffae00" stop-opacity="0" />
                      </radialGradient>
                      <radialGradient id="glassGrad" cx="38%" cy="32%" r="75%">
                        <stop offset="0" stop-color="#ffffff" stop-opacity=".95" />
                        <stop offset=".6" stop-color="#e8eef6" stop-opacity=".75" />
                        <stop offset="1" stop-color="#cbd5e1" stop-opacity=".7" />
                      </radialGradient>
                      <radialGradient id="lampGlowFill" cx="50%" cy="48%" r="55%">
                        <stop offset="0" stop-color="#fffbe0" />
                        <stop offset=".55" stop-color="#ffe27a" />
                        <stop offset="1" stop-color="#ffb300" />
                      </radialGradient>
                      <linearGradient id="metalGrad" x1="0" x2="1">
                        <stop offset="0" stop-color="#94a3b8" />
                        <stop offset=".45" stop-color="#e2e8f0" />
                        <stop offset="1" stop-color="#94a3b8" />
                      </linearGradient>
                      <linearGradient id="socketGrad" x1="0" x2="1">
                        <stop offset="0" stop-color="#334155" />
                        <stop offset=".5" stop-color="#64748b" />
                        <stop offset="1" stop-color="#334155" />
                      </linearGradient>
                      <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#64748b" />
                        <stop offset=".5" stop-color="#94a3b8" />
                        <stop offset="1" stop-color="#475569" />
                      </linearGradient>
                      <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="3" />
                      </filter>
                      <linearGradient id="cgChassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#f8fafc" />
                        <stop offset="100%" stop-color="#e2e8f0" />
                      </linearGradient>
                    </defs>
                    <rect id="scene-bg" width="1000" height="690" fill="#ffffff" />
                    <g id="viewport">
                      <g id="motor" class="apparatus" data-apparatus="motor" data-base="-30,20" transform="translate(-30 20)">
                        <rect x="6" y="40" width="370" height="440" fill="transparent" />

                        <!-- LAYER 1: 3D BACK COIL TURNS (Behind Stator Teeth) -->
                        <g id="stator-windings-back" fill="none" stroke-width="4.6" stroke-linecap="round"
                          stroke-linejoin="round">
                          <!-- Phase 1 Back Turns (Dark Orange Shadow) -->
                          <g stroke="#9a3412">
                            <use href="#pole-coil-back-p1" />
                            <use href="#pole-coil-back-p4" />
                          </g>
                          <!-- Phase 2 Back Turns (Dark Cyan Shadow) -->
                          <g data-phase="2" data-rot="2" stroke="#075985" transform="rotate(120 200 260)">
                            <use href="#pole-coil-back-p1" />
                            <use href="#pole-coil-back-p4" />
                          </g>
                          <!-- Phase 3 Back Turns (Dark Magenta Shadow) -->
                          <g data-phase="3" data-rot="3" stroke="#6b21a8" transform="rotate(240 200 260)">
                            <use href="#pole-coil-back-p1" />
                            <use href="#pole-coil-back-p4" />
                          </g>
                        </g>

                        <!-- LAYER 2: UNIFIED STATOR BODY (Motor Area - Centered at 200, 260) -->
                        <g id="motor-stator" data-origin-x="200" data-origin-y="260"
                          transform="translate(-40 52) scale(0.8)" fill="#888888" stroke="none">
                          <polygon points="200,400 170,502 215,502 250,400" />
                          <polygon points="400,400 430,502 385,502 350,400" />
                          <rect x="160" y="500" width="280" height="22" rx="8" ry="8" />

                          <path fill-rule="evenodd" d="
          M 300,85 
          A 175 175 0 1 0 300,435 
          A 175 175 0 1 0 300,85 
          Z 
          M 300,130 
          A 130 130 0 1 1 300,390 
          A 130 130 0 1 1 300,130 
          Z" />

                          <!-- Each winding owns an opposing pair of stator poles.  The
                               second winding moves to 90 degrees in two-phase mode. -->
                          <use href="#stator-pole" data-phase="1" data-stator-phase="1" data-stator-side="0"
                            transform="rotate(0 300 260)" />
                          <use href="#stator-pole" data-phase="1" data-stator-phase="1" data-stator-side="180"
                            transform="rotate(180 300 260)" />
                          <use href="#stator-pole" data-phase="2" data-stator-phase="2" data-stator-side="0"
                            transform="rotate(120 300 260)" />
                          <use href="#stator-pole" data-phase="2" data-stator-phase="2" data-stator-side="180"
                            transform="rotate(300 300 260)" />
                          <use href="#stator-pole" data-phase="3" data-stator-phase="3" data-stator-side="0"
                            transform="rotate(240 300 260)" />
                          <use href="#stator-pole" data-phase="3" data-stator-phase="3" data-stator-side="180"
                            transform="rotate(60 300 260)" />
                          <circle cx="300" cy="260" r="153" fill="none" stroke="#f8fafc" stroke-opacity=".48"
                            stroke-width="5" />
                          <circle cx="300" cy="260" r="137" fill="none" stroke="#1e293b" stroke-opacity=".5"
                            stroke-width="4" />
                        </g>

                        <!-- Mounting Base Bolts (Aligned on Stator Base Plate at x=110 & x=290, y=461) -->
                        <g id="motor-base" data-origin-x="200" data-origin-y="260" transform="translate(0 0)">
                          <circle cx="110" cy="461" r="3.5" fill="#6b7280" />
                          <circle cx="290" cy="461" r="3.5" fill="#6b7280" />
                        </g>

                        <!-- LAYER 3: 3D FRONT COIL TURNS & PHASE JUMPERS (100% Continuous Physical Circuit) -->
                        <g id="stator-windings-front" fill="none" stroke-linecap="round" stroke-linejoin="round">

                          <!-- Phase 1 (Orange): From U1 (200, 118) -> Pole 1 -> Jumper -> Pole 4 -> U2 (200, 402) -->
                          <g stroke="#ea580c" filter="url(#coil-shadow)">
                            <!-- Pole 1 Lead-in from U1 (200, 118) & Front Turns 1..4 (ends at 181, 199) -->
                            <path stroke-width="4.8" d="M 200, 118 L 200, 140 C 200, 146 219, 144 219, 150
                   C 213, 152 187, 155 181, 157
                   M 219, 164 C 213, 166 187, 169 181, 171
                   M 219, 178 C 213, 180 187, 183 181, 185
                   M 219, 192 C 213, 194 187, 197 181, 199" />
                            <!-- Phase 1 Outer Jumper: from (181, 199) to (181, 321) along left outer rim -->
                            <path stroke-width="4.2"
                              d="M 181, 199 C 135, 199 52, 208 52, 260 C 52, 312 135, 321 181, 321" />
                            <!-- Pole 4 Front Turns 1..4 & Lead-out into U2 (starts at 181, 321, ends at 200, 402) -->
                            <path stroke-width="4.8" d="M 181, 321 C 187, 323 213, 326 219, 328
                   M 181, 335 C 187, 337 213, 340 219, 342
                   M 181, 349 C 187, 351 213, 354 219, 356
                   M 181, 363 C 187, 365 213, 368 219, 370
                   C 219, 378 200, 376 200, 402" />
                          </g>

                          <!-- Phase 2 (Cyan): From V1 (323, 331) -> Pole 3 -> Jumper -> Pole 6 -> V2 (77, 189) -->
                          <g data-phase="2" data-rot="2" stroke="#0284c7" filter="url(#coil-shadow)"
                            transform="rotate(120 200 260)">
                            <!-- Pole 3 Lead-in & Front Turns 1..4 (ends at 181, 199) -->
                            <path stroke-width="4.8" d="M 200, 118 L 200, 140 C 200, 146 219, 144 219, 150
                   C 213, 152 187, 155 181, 157
                   M 219, 164 C 213, 166 187, 169 181, 171
                   M 219, 178 C 213, 180 187, 183 181, 185
                   M 219, 192 C 213, 194 187, 197 181, 199" />
                            <!-- Phase 2 Outer Jumper at R = 153 (x = 47) -->
                            <path stroke-width="4.2"
                              d="M 181, 199 C 135, 199 47, 208 47, 260 C 47, 312 135, 321 181, 321" />
                            <!-- Pole 6 Front Turns 1..4 & Lead-out into V2 -->
                            <path stroke-width="4.8" d="M 181, 321 C 187, 323 213, 326 219, 328
                   M 181, 335 C 187, 337 213, 340 219, 342
                   M 181, 349 C 187, 351 213, 354 219, 356
                   M 181, 363 C 187, 365 213, 368 219, 370
                   C 219, 378 200, 376 200, 402" />
                          </g>

                          <!-- Phase 3 (Magenta): From W1 (77, 331) -> Pole 5 -> Jumper -> Pole 2 -> W2 (323, 189) -->
                          <g data-phase="3" data-rot="3" stroke="#9333ea" filter="url(#coil-shadow)"
                            transform="rotate(240 200 260)">
                            <!-- Pole 5 Lead-in & Front Turns 1..4 (ends at 181, 199) -->
                            <path stroke-width="4.8" d="M 200, 118 L 200, 140 C 200, 146 219, 144 219, 150
                   C 213, 152 187, 155 181, 157
                   M 219, 164 C 213, 166 187, 169 181, 171
                   M 219, 178 C 213, 180 187, 183 181, 185
                   M 219, 192 C 213, 194 187, 197 181, 199" />
                            <!-- Phase 3 Outer Jumper at R = 158 (x = 42) -->
                            <path stroke-width="4.2"
                              d="M 181, 199 C 135, 199 42, 208 42, 260 C 42, 312 135, 321 181, 321" />
                            <!-- Pole 2 Front Turns 1..4 & Lead-out into W2 -->
                            <path stroke-width="4.8" d="M 181, 321 C 187, 323 213, 326 219, 328
                   M 181, 335 C 187, 337 213, 340 219, 342
                   M 181, 349 C 187, 351 213, 354 219, 356
                   M 181, 363 C 187, 365 213, 368 219, 370
                   C 219, 378 200, 376 200, 402" />
                          </g>

                          <!-- 3D Specular Highlight Lines (Gleaming Metallic Sheen along the front of each turn) -->
                          <g stroke="#ffffff" stroke-width="1.3" opacity="0.6">
                            <path d="M 218, 150 C 212, 152 188, 155 182, 157
                   M 218, 164 C 212, 166 188, 169 182, 171
                   M 218, 178 C 212, 180 188, 183 182, 185
                   M 218, 192 C 212, 194 188, 197 182, 199
                   M 182, 321 C 188, 323 212, 326 218, 328
                   M 182, 335 C 188, 337 212, 340 218, 342
                   M 182, 349 C 188, 351 212, 354 218, 356
                   M 182, 363 C 188, 365 212, 368 218, 370" />
                            <path data-phase="2" data-rot="2" transform="rotate(120 200 260)" d="M 218, 150 C 212, 152 188, 155 182, 157
                   M 218, 164 C 212, 166 188, 169 182, 171
                   M 218, 178 C 212, 180 188, 183 182, 185
                   M 218, 192 C 212, 194 188, 197 182, 199
                   M 182, 321 C 188, 323 212, 326 218, 328
                   M 182, 335 C 188, 337 212, 340 218, 342
                   M 182, 349 C 188, 351 212, 354 218, 356
                   M 182, 363 C 188, 365 212, 368 218, 370" />
                            <path data-phase="3" data-rot="3" transform="rotate(240 200 260)" d="M 218, 150 C 212, 152 188, 155 182, 157
                   M 218, 164 C 212, 166 188, 169 182, 171
                   M 218, 178 C 212, 180 188, 183 182, 185
                   M 218, 192 C 212, 194 188, 197 182, 199
                   M 182, 321 C 188, 323 212, 326 218, 328
                   M 182, 335 C 188, 337 212, 340 218, 342
                   M 182, 349 C 188, 351 212, 354 218, 356
                   M 182, 363 C 188, 365 212, 368 218, 370" />
                          </g>
                        </g>

                        <!-- Phase 1: Top (1 Live) & Bottom (1 Neutral) -->
                        <g class="ph-terminals" data-phase="1">
                          <line x1="200" y1="118" x2="200" y2="88" stroke="#ea580c" stroke-width="3.6" stroke-linecap="round" />
                          <g class="terminal-badge" transform="translate(200 88)">
                            <circle class="badge-bg" r="12" />
                            <text>1</text>
                            <circle class="stud" id="stud-p1-live" data-anchor="stud-p1-live" r="5" fill="#ea580c" fill-opacity="0.3" stroke="#ea580c" stroke-width="1.2" />
                          </g>

                          <line x1="200" y1="402" x2="200" y2="432" stroke="#ea580c" stroke-width="3.6" stroke-linecap="round" />
                          <g class="terminal-badge" transform="translate(200 432)">
                            <circle class="badge-bg" r="12" />
                            <text>1</text>
                            <circle class="stud" id="stud-p1-neu" data-anchor="stud-p1-neu" r="5" fill="#334155" fill-opacity="0.3" stroke="#334155" stroke-width="1.2" />
                          </g>
                        </g>

                        <!-- Phase 2: Upper-Right (2 Live) & Lower-Left (2 Neutral) -->
                        <g class="ph-terminals" data-phase="2">
                          <line x1="323" y1="189" x2="349" y2="174" stroke="#0284c7" stroke-width="3.6" stroke-linecap="round" />
                          <g class="terminal-badge" transform="translate(349 174)">
                            <circle class="badge-bg" r="12" />
                            <text>2</text>
                            <circle class="stud" id="stud-p2-live" data-anchor="stud-p2-live" r="5" fill="#0284c7" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.2" />
                          </g>

                          <line x1="77" y1="331" x2="51" y2="346" stroke="#0284c7" stroke-width="3.6" stroke-linecap="round" />
                          <g class="terminal-badge" transform="translate(51 346)">
                            <circle class="badge-bg" r="12" />
                            <text>2</text>
                            <circle class="stud" id="stud-p2-neu" data-anchor="stud-p2-neu" r="5" fill="#334155" fill-opacity="0.3" stroke="#334155" stroke-width="1.2" />
                          </g>
                        </g>

                        <!-- Phase 3: Lower-Right (3 Live) & Upper-Left (3 Neutral) -->
                        <g class="ph-terminals" data-phase="3">
                          <line x1="323" y1="331" x2="349" y2="346" stroke="#9333ea" stroke-width="3.6" stroke-linecap="round" />
                          <g class="terminal-badge" transform="translate(349 346)">
                            <circle class="badge-bg" r="12" />
                            <text>3</text>
                            <circle class="stud" id="stud-p3-live" data-anchor="stud-p3-live" r="5" fill="#9333ea" fill-opacity="0.3" stroke="#9333ea" stroke-width="1.2" />
                          </g>

                          <line x1="77" y1="189" x2="51" y2="174" stroke="#9333ea" stroke-width="3.6" stroke-linecap="round" />
                          <g class="terminal-badge" transform="translate(51 174)">
                            <circle class="badge-bg" r="12" />
                            <text>3</text>
                            <circle class="stud" id="stud-p3-neu" data-anchor="stud-p3-neu" r="5" fill="#334155" fill-opacity="0.3" stroke="#334155" stroke-width="1.2" />
                          </g>
                        </g>
                        <!-- LAYER 9: CYLINDRICAL ROTOR & SHAFT ASSEMBLY (Motor Area - Centered at 200, 260) -->
                        <g id="motor-rotor" data-origin-x="200" data-origin-y="260" transform="translate(0 0)">
                          <use id="rotorUse" href="#rotor" transform="translate(200 260) rotate(-30) scale(52)" />
                        </g>

                        <g id="motor-shaft" data-origin-x="200" data-origin-y="260"
                          transform="translate(-40 52) scale(0.8)">
                          <circle cx="300" cy="260" r="16" fill="url(#shaftGlow)" stroke="#1f2937" stroke-width="0.8" />
                          <circle cx="300" cy="260" r="10" fill="#f9fafc" />
                          <circle cx="300" cy="260" r="4.5" fill="#111827" />
                          <circle cx="297.5" cy="257.5" r="1.8" fill="#ffffff" opacity="0.8" />
                        </g>


                      </g>

                      <!-- LEFT BYPASS ROUTE FOR MOTOR TERMINAL 3 (NEUTRAL) -->
                      <g id="left-bypass-route" data-phase="3">
                        <circle class="junction-dot" id="bypass-dot-top" cx="18" cy="194" r="5" fill="#bae6fd" stroke="#0284c7" stroke-width="1.8" />
                        <circle class="junction-dot" id="bypass-dot-bot" cx="18" cy="620" r="5" fill="#bae6fd" stroke="#0284c7" stroke-width="1.8" />
                      </g>

                      <!-- LAMP 1 (PHASE 1) -->
                      <g id="lamp1" class="apparatus lamp" data-apparatus="lamp1" data-phase="" data-base="450,320"
                        transform="translate(450 320)">
                        <rect x="-45" y="-95" width="90" height="115" fill="transparent" />
                        <circle class="lamp-halo" cx="0" cy="-45" r="52" fill="url(#lampHalo)" opacity="0" />
                        <path d="M-10,-22 C-10,-30 -24,-35 -24,-50 A24,24 0 0 1 24,-50 C24,-35 10,-30 10,-22 Z"
                          fill="url(#glassGrad)" stroke="#94a3b8" stroke-width="1.4" />
                        <path class="lamp-glow"
                          d="M-10,-22 C-10,-30 -24,-35 -24,-50 A24,24 0 0 1 24,-50 C24,-35 10,-30 10,-22 Z"
                          fill="url(#lampGlowFill)" opacity="0" />
                        <path d="M-2,-22 L-2,-31 L2,-31 L2,-22" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
                        <path d="M-2,-30 L-6,-50 M2,-30 L6,-50" fill="none" stroke="#64748b" stroke-width="1.2" />
                        <polyline class="lamp-fil-glow"
                          points="-6,-50 -4,-54 -2,-50 0,-54 2,-50 4,-54 6,-50" fill="none"
